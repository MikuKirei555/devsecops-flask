name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===================== STAGE 1: SHIFT-LEFT (paralel) =====================
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config p/owasp-top-ten --error app

  bandit:
    name: Bandit (SAST Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r app -ll

  hadolint:
    name: Hadolint (Lint Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  pylint:
    name: Pylint (Skor >= 9.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pylint app tests --fail-under=9.0

  pip-audit:
    name: pip-audit (CVE Dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  pytest:
    name: pytest (Coverage >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ===================== Ringkasan Stage 1 (bahan Security Score) =====================
  stage1-summary:
    name: Stage 1 Summary
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, bandit, hadolint, pylint, pip-audit, pytest]
    if: always()
    steps:
      - name: Hitung skor dan tampilkan ringkasan
        env:
          R_GITLEAKS: ${{ needs.gitleaks.result }}
          R_SEMGREP: ${{ needs.semgrep.result }}
          R_BANDIT: ${{ needs.bandit.result }}
          R_HADOLINT: ${{ needs.hadolint.result }}
          R_PYLINT: ${{ needs.pylint.result }}
          R_PIPAUDIT: ${{ needs.pip-audit.result }}
          R_PYTEST: ${{ needs.pytest.result }}
        run: |
          passed=0; total=0
          {
            echo "## Stage 1 - Shift-Left"
            echo "| Job | Hasil |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in "Gitleaks:$R_GITLEAKS" "Semgrep:$R_SEMGREP" "Bandit:$R_BANDIT" \
                      "Hadolint:$R_HADOLINT" "Pylint:$R_PYLINT" "pip-audit:$R_PIPAUDIT" "pytest:$R_PYTEST"; do
            name="${pair%%:*}"; res="${pair##*:}"; total=$((total+1))
            if [ "$res" = "success" ]; then passed=$((passed+1)); icon="LOLOS"; else icon="GAGAL"; fi
            echo "| $name | $icon |" >> "$GITHUB_STEP_SUMMARY"
          done
          score=$((passed*100/total))
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Skor Stage 1: $score / 100**" >> "$GITHUB_STEP_SUMMARY"
          [ "$passed" -eq "$total" ] || exit 1
